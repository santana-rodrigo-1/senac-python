{% extends 'core/base.html' %}
{% block title %}Elevadores — ElevaTech{% endblock %}

{% block content %}
<h1 class="mb-3">Nossos elevadores</h1>

<form class="mb-4" method="get">
    <input class="form-control" name="q" placeholder="Buscar...">
</form>

<div class="row g-3">
    {% for elevador in elevadores %}
    <div class="col-md-4">
        {% include 'core/_elevador_card.html' %}
    </div>
    {% empty %}
    <p>Nenhum elevador encontrado.</p>
    {% endfor %}
</div>
{% endblock %}
