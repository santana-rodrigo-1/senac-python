{% extends "core/base.html" %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-4">
        Cadastrar produto
    </h1>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

<div class="mb-3">
    <label class="form-label">
        Imagem do produto
    </label>
    {{ form.imagem }}
</div>

        <button
            type="submit"
            class="btn btn-primary">

            Salvar produto

        </button>

    </form>

</div>
