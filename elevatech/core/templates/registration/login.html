{% extends 'core/base.html' %}
{% block title %}Entrar — ElevaTech{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container" style="max-width: 480px;">
        <div class="caixa-filtro p-4 p-md-5 mt-4">
            <h1 class="h3 mb-4" style="color:#fff;">Entrar</h1>

            {% if form.errors %}
            <div class="alert alert-danger">
                Usuário ou senha incorretos. Tente novamente.
            </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label form-label-escuro">Usuário</label>
                    <input type="text" name="username" id="id_username" class="form-control" autofocus required
                        placeholder="seu.usuario">
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label form-label-escuro">Senha</label>
                    <input type="password" name="password" id="id_password" class="form-control" required
                        placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-laranja w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <hr class="my-4" style="border-color: var(--grafite-claro);">

            <p class="small text-center mb-0" style="color: var(--texto-muted);">
                Não tem conta?
                <a href="{% url 'register' %}" style="color: var(--laranja-marca);">Cadastre-se</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
