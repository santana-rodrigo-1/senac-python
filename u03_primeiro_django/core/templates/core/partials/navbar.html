<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Marca / Logo -->
        <a class="navbar-brand text-white m-0" href="{% url 'home' %}">
            SneakZone
        </a>

        <!-- Botão para telas menores (Responsivo) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links e Ações do Usuário (Envolvidos no collapse para telas menores) -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            
            <!-- Mudança aqui: de 'flex-wrap' para 'flex-column flex-lg-row' com larguras adaptadas -->
            <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2 mt-3 mt-lg-0 w-100 justify-content-end">

                <a class="btn btn-dark text-white text-start text-lg-center" href="{% url 'home' %}">
                    Home
                </a>

                <a class="btn btn-dark text-white text-start text-lg-center" href="{% url 'produtos' %}">
                    Produtos
                </a>

                <a class="btn btn-dark text-white text-start text-lg-center" href="{% url 'sobre' %}">
                    Sobre
                </a>

                {% if user.is_authenticated %}

                    <span class="text-white ms-lg-2 my-2 my-lg-0 text-start">
                        Olá, {{ user.first_name|default:user.username }}
                    </span>

                    {% if user.is_staff %}
                        <a href="/admin/" class="btn btn-outline-warning btn-sm text-start text-lg-center">
                            Administração
                        </a>
                    {% endif %}

                    <a href="{% url 'produto_novo' %}" class="btn btn-primary btn-sm text-start text-lg-center">
                        + Novo produto
                    </a>

                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm w-100 text-start text-lg-center">
                            Sair
                        </button>
                    </form>

                {% else %}

                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm text-start text-lg-center ms-lg-2">
                        Entrar
                    </a>

                    <a href="{% url 'cadastro' %}" class="btn btn-success btn-sm text-start text-lg-center">
                        Criar conta
                    </a>

                {% endif %}

            </div>
        </div>

    </div>
</nav>
