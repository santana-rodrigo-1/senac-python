<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
</head>
<body>
    <h1>Página de Produtos</h1>
    <table>
        <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Ativo</th>
        </tr>
        {% for produto in produtos %}
        <tr>
            <td>{{produto.nome}}</td>
            <td>{{produto.preco}}</td>
            <td>{{produto.ativo}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
