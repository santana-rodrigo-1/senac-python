<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
</head>
<body>
    <h1>Página de Produtos</h1>
    <table>
        <th>
            <tr>Nome</tr>
            <tr>Preço</tr>
            <tr>Ativo</tr>
        </th>
        {% for produto in produtos %}
        <tr>
            <td>{{produto.nome}}</td>
            <td>{{produto.preco}}</td>
            <td>{{produto.ativo}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
