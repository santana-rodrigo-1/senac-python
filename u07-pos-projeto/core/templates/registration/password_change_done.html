{% extends 'core/base.html' %}

{% block title %}Senha Alterada — ElevaTech{% endblock %}

{% block content %}
<div class="container py-5 my-4 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-5 shadow-sm border-0">
                
                <i class="bi bi-check-circle-fill display-3 mb-3" style="color: #1f9d5b;"></i>
                <h2 class="fw-bold mb-3">Senha alterada!</h2>
                <p class="text-muted mb-4">Sua nova senha foi salva com segurança. No próximo login, use a nova senha.</p>
                
                <a href="{% url 'perfil' %}" class="btn btn-laranja w-100 py-3 fw-bold">
                    Voltar ao Meu Perfil
                </a>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
