{% extends 'core/base.html' %}

{% block title %}Cadastrar Elevador — ElevaTech{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 shadow-sm">
                <h2 class="fw-bold mb-4">Cadastrar / Editar Elevador</h2>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Renderiza o formulário -->
                    {{ form.as_p }}

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-laranja px-4">Salvar</button>
                        <a href="{% url 'catalogo' %}" class="btn btn-secundario px-4">Cancelar</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
