{% extends 'core/base.html' %}

{% block title %}Entrar — ElevaTech{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-5">
            <div class="card bg-dark border-secondary text-white shadow-lg p-4">
                <h2 class="text-center fw-bold mb-4">Acessar Conta</h2>
                
                <form method="post">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger small">Usuário ou senha incorretos.</div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label text-muted small">Usuário</label>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted small">Senha</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                    </div>

                    <button type="submit" class="btn btn-laranja w-100 fw-bold py-2">Entrar</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Não tem conta? <a href="#" class="texto-laranja text-decoration-none">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
