  <form id="formCadastro" novalidate>
                <div>
                  <div>
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex.: Ana Paula Souza" required>
                    <div>Por favor, informe seu nome completo.</div>
                  </div>
                  <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="voce@email.com" required>
                    <div>Por favor, informe um e-mail válido.</div>
                  </div>
                  <div>
                    <label for="telefone">Telefone (com DDD)</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(21) 90000-0000" pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" title="Use o formato (21) 90000-0000" required>
                    <div>Use o formato (21) 90000-0000.</div>
                  </div>
                  <div>
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" name="idade" min="0" max="120" placeholder="Ex.: 25" required>
                    <div>Por favor, informe uma idade válida.</div>
                  </div>
                  <div>
                    <label for="numeracao">Numeração</label>
                    <select id="numeracao" name="numeracao" required>
                      <option value="" selected disabled>Escolha...</option>
                      <option>36</option><option>37</option><option>38</option><option>39</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option>
                    </select>
                    <div>Selecione uma numeração.</div>
                  </div>
                  <div>
                    <label for="cor">Cor preferida</label>
                    <input type="color" id="cor" name="cor" value="#ff6b35">
                  </div>
                  <div>
                    <span>Estilo favorito</span>
                    <div>
                      <input type="radio" name="estilo" id="estiloEsportivo" value="Esportivo" checked>
                      <label for="estiloEsportivo">Esportivo</label>
                    </div>
                    <div>
                      <input type="radio" name="estilo" id="estiloCasual" value="Casual">
                      <label for="estiloCasual">Casual</label>
                    </div>
                    <div>
                      <input type="radio" name="estilo" id="estiloBasquete" value="Basquete">
                      <label for="estiloBasquete">Basquete</label>
                    </div>
                  </div>
                  <div>
                    <label for="mensagem">Alguma observação?</label>
                    <textarea id="mensagem" name="mensagem" rows="3" placeholder="Conte o que você procura..."></textarea>
                  </div>
                  <div>
                    <div>
                      <input type="checkbox" id="termos" required>
                      <label for="termos">Li e aceito os termos e a política de privacidade (LGPD).</label>
                      <div>Você precisa aceitar os termos para se cadastrar.</div>
                    </div>
                  </div>
                  <div>
                    <button type="submit"><i></i> Cadastrar</button>
                    <button type="reset">Limpar</button>
                  </div>
                </div>
              </form>
