{% extends "core/base.html" %}

{% block content %}

<div class="container py-5">

    <h1 class="fw-bold mb-4">
        Catálogo ElevaTech
    </h1>

    <div class="row">

        {% for produto in produtos %}

        <div class="col-md-6 col-lg-4 mb-4">

            <div class="card h-100 shadow-sm">

                {% if produto.imagem %}
                <img src="{{ produto.imagem.url }}" class="card-img-top" alt="{{ produto.nome }}">
                {% endif %}

                <div class="card-body">

                    <h5 class="card-title">
                        {{ produto.nome }}
                    </h5>

                    <p class="text-muted">
                        {{ produto.categoria }}
                    </p>

                    <h4 class="text-primary">
                        R$ {{ produto.preco }}
                    </h4>

                    <a href="{% url 'detalhes_produto' produto.id %}" class="btn btn-primary">

                        Ver Detalhes

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
