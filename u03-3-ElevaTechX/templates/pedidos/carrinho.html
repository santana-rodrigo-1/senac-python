<div class="col-lg-4">

    <div class="card border-0 shadow rounded-4 sticky-top">

        <div class="card-body">

            <h4 class="fw-bold mb-4">
                Resumo do Pedido
            </h4>

            <div class="d-flex justify-content-between mb-2">

                <span>Produtos</span>

                <span>
                    R$ {{ total|floatformat:2 }}
                </span>

            </div>

            <div class="d-flex justify-content-between mb-2">

                <span>Frete</span>

                <span>
                    R$ 500,00
                </span>

            </div>

            <hr>

            <div class="d-flex justify-content-between align-items-center mb-4">

                <strong>Total</strong>

                <strong class="fs-4 text-primary">
                    R$ {{ total|floatformat:2 }}
                </strong>

            </div>

            <button class="btn btn-primary w-100">
                Finalizar Compra
            </button>

        </div>

    </div>

</div>

</div>

{% else %}

<div class="card border-0 shadow-sm rounded-4">

    <div class="card-body text-center py-5">

        <h3>
            Seu carrinho está vazio
        </h3>

        <p class="text-muted">
            Adicione equipamentos ao pedido para continuar.
        </p>

        <a href="{% url 'catalogo' %}" class="btn btn-primary">
            Ver Catálogo
        </a>

    </div>

</div>

{% endif %}

</div>

{% endblock %}
