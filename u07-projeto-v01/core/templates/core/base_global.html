{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ElevaTech{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'core/img/favicon.svg' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'core/css/estilo.css' %}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pace/1.2.4/themes/black/pace-theme-minimal.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pace/1.2.4/pace.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- BLOCO DO CABEÇALHO: A Loja e o Painel injetam seus menus aqui -->
    {% block header %}{% endblock %}

    <main class="flex-grow-1 d-flex flex-column">
        
        <!-- Alertas do Django (Aparece na Loja e no Painel) -->
        {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
            <div class="alert alert-dismissible fade show shadow-sm border-0" role="alert"
                style="background-color: var(--bg-card); color: var(--texto-principal); border-left: 5px solid var(--laranja) !important;">
                <i class="bi bi-info-circle-fill me-2" style="color: var(--laranja);"></i>
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- BLOCO DE CONTEÚDO: Onde as páginas (Home, Produtos, etc) injetam o miolo -->
        {% block content %}{% endblock %}
        
    </main>

    <!-- Inclui o Rodapé Global -->
    {% include 'core/_footer.html' %}

    <!-- Scripts Globais (Tema e Botão Topo) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- 1. Alternador de Tema ---
        const themeButtons = document.querySelectorAll('.theme-toggle-btn');
        const themeIcons = document.querySelectorAll('.theme-icon');
        const html = document.documentElement;

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            html.setAttribute('data-theme', 'dark');
            themeIcons.forEach(icon => icon.className = 'bi bi-sun');
        }

        themeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (html.getAttribute('data-theme') === 'dark') {
                    html.removeAttribute('data-theme');
                    themeIcons.forEach(icon => icon.className = 'bi bi-moon-stars');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.setAttribute('data-theme', 'dark');
                    themeIcons.forEach(icon => icon.className = 'bi bi-sun');
                    localStorage.setItem('theme', 'dark');
                }
            });
        });

        // --- 2. Botão Voltar ao Topo ---
        const btnTopo = document.getElementById("btn-topo");
        if (btnTopo) {
            window.addEventListener("scroll", () => {
                if (window.scrollY > 300) {
                    btnTopo.classList.add("mostrar");
                } else {
                    btnTopo.classList.remove("mostrar");
                }
            });
            btnTopo.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }
    </script>
    
    <!-- Bloco extra para scripts específicos (como o do carrossel) -->
    {% block extra_js %}{% endblock %}
</body>
</html>
