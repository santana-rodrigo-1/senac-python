{% extends 'core/base_global.html' %}

{% block header %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-2">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3 mb-0" href="{% url 'painel_home' %}">
            <i class="bi bi-buildings" style="color: #ff6b35;"></i> ElevaTech <span class="fs-6 fw-normal text-white-50 ms-2">| Painel</span>
        </a>

        <div class="d-flex align-items-center d-lg-none ms-auto">
            <button class="theme-toggle-btn btn btn-sm rounded-circle d-flex align-items-center justify-content-center me-2"
                style="border: 2px solid #ff6b35; width: 38px; height: 38px; background: transparent; transition: 0.3s;">
                <i class="theme-icon bi bi-moon-stars" style="color: #ff6b35; font-size: 1.2rem;"></i>
            </button>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <div class="d-flex flex-column flex-lg-row align-items-lg-center w-100 mt-4 mt-lg-0 pb-3 pb-lg-0 justify-content-lg-end">
                
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 gap-lg-4">
                    <a class="nav-link text-white p-0 fw-medium py-2 py-lg-0 text-nowrap" href="{% url 'painel_home' %}">Visão Geral</a>
                    <a class="nav-link text-white p-0 fw-medium py-2 py-lg-0 text-nowrap" href="{% url 'painel_produtos' %}">Produtos</a>
                    <a class="nav-link text-white p-0 fw-medium py-2 py-lg-0 text-nowrap" href="{% url 'painel_pedidos' %}">Pedidos</a>
                </div>

                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 mt-3 mt-lg-0 ms-lg-4">
                    <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center gap-2 gap-lg-3 px-3 py-3 py-lg-2 rounded text-nowrap w-100 w-lg-auto" 
                         style="background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);">
                        
                        <span class="text-white-50 fw-medium mb-1 mb-lg-0">Olá, {{ user.username }}</span>
                        
                        <a class="nav-link text-white p-0 fw-medium py-1 py-lg-0" href="{% url 'home' %}">
                            <i class="bi bi-shop"></i> Loja
                        </a>
                        
                        <a class="nav-link text-white p-0 fw-medium py-1 py-lg-0" href="{% url 'elevador_novo' %}">
                            <i class="bi bi-plus-lg"></i> Novo
                        </a>

                        <form method="post" action="{% url 'logout' %}" class="d-inline mb-0 py-1 py-lg-0">
                            {% csrf_token %}
                            <button type="submit" class="nav-link text-white p-0 fw-medium btn-link-custom">Sair</button>
                        </form>
                    </div>

                    <div class="d-none d-lg-flex align-items-center ps-lg-3 border-lg-start border-secondary">
                        <button class="theme-toggle-btn btn btn-sm rounded-circle d-flex align-items-center justify-content-center"
                            style="border: 2px solid #ff6b35; width: 38px; height: 38px; background: transparent; transition: 0.3s;">
                            <i class="theme-icon bi bi-moon-stars" style="color: #ff6b35; font-size: 1.2rem;"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<!-- O container garante que o conteúdo do painel tenha margem e fique centralizado -->
<div class="container py-4">
    {% block painel_content %}{% endblock %}
</div>
{% endblock %}
