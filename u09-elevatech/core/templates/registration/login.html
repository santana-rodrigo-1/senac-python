{% extends 'core/base.html' %}

{% block title %}Entrar — ElevaTech{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-sm">
                <h3 class="fw-bold text-center mb-4">Acessar Conta</h3>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-laranja w-100 mt-3">Entrar</button>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <p class="text-muted small mb-0">
                        Não tem conta? <a href="{% url 'register' %}" class="text-decoration-none fw-bold"
                            style="color: var(--laranja);">Cadastre-se</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
