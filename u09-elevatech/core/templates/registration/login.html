{% extends 'core/base.html' %}

{% block title %}Acessar Conta — ElevaTech{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- Card Branco Limpo -->
            <div class="card p-5 shadow-sm border-0 mt-4" style="border-radius: 12px;">

                <!-- Título alinhado à esquerda, igual ao Criar Conta -->
                <h2 class="fw-bold mb-4">Acessar conta</h2>

                <form method="post" novalidate>
                    {% csrf_token %}

                    <!-- Mensagem de erro se a senha estiver errada -->
                    {% if form.errors %}
                    <div class="alert alert-danger small">Usuário ou senha incorretos. Tente novamente.</div>
                    {% endif %}

                    <!-- CAMPO USUÁRIO -->
                    <div class="mb-4">
                        <label for="{{ form.username.id_for_label }}" class="form-label fw-bold small"
                            style="color: #475569;">Usuário</label>
                        <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                            class="form-control form-control-lg border-0" placeholder="seu.usuario" required
                            style="font-size: 0.95rem;" autofocus>
                    </div>

                    <!-- CAMPO SENHA -->
                    <div class="mb-4">
                        <label for="{{ form.password.id_for_label }}" class="form-label fw-bold small"
                            style="color: #475569;">Senha</label>
                        <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                            class="form-control form-control-lg border-0" placeholder="••••••••" required
                            style="font-size: 0.95rem;">
                    </div>

                    <!-- Botão Laranja Grande -->
                    <button type="submit" class="btn btn-laranja w-100 py-3 fw-bold mt-2" style="font-size: 1rem;">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
                    </button>
                </form>

                <hr class="my-4" style="border-color: #e2e8f0;">

                <!-- Link de Cadastro embaixo -->
                <p class="text-center small mb-0" style="color: #475569;">
                    Não tem conta? <a href="{% url 'register' %}" class="text-decoration-none fw-bold"
                        style="color: var(--laranja);">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
