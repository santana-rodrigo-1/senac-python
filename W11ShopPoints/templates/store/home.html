{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">

    Wallpapers

</h1>

<div class="row">

    {% for wallpaper in wallpapers %}

    <div class="col-md-4 mb-4">

        <div class="card h-100 shadow-sm">

            <img src="{{ wallpaper.imagem.url }}"
                 class="card-img-top">

            <div class="card-body">

                <h5>

                    {{ wallpaper.nome }}

                </h5>

                <p>

                    {{ wallpaper.descricao }}

                </p>

                <h4 class="text-primary">

                    {{ wallpaper.preco }} ⭐

                </h4>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
